# ─────────────────────────────────────────────────────────────────────────────
# Kokoro Tamil Fine-Tuning Config
# ─────────────────────────────────────────────────────────────────────────────
# Adapted from kokoro-deutsch/configs/config_german_ft.yml
# For fine-tuning Kokoro-82M on Tamil audio data
# ─────────────────────────────────────────────────────────────────────────────

# ── Top-level params (read by train_first.py, NOT from training: block) ─────
batch_size: 8                          # A100 80GB can handle 8-12; L4: 4
epochs: 10                             # number of epochs for each stage
epochs_1st: 10                         # Stage 1 epochs
epochs_2nd: 10                         # Stage 2 epochs
save_freq: 1                           # save checkpoint every N epochs
pretrained_model: "../training/kokoro_base.pth"
first_stage_path: "first_stage.pth"
load_only_params: true                 # CRITICAL: ignore missing diffusion/SLM keys
second_stage_load_pretrained: false    # false = load from first_stage.pth (recommended)

# ── Logging ──────────────────────────────────────────────────────────────────
log_dir: "logs/kokoro-tamil"

# ── Data ─────────────────────────────────────────────────────────────────────
data_params:
  train_data: "../training/train_list.txt"
  val_data: "../training/val_list.txt"
  root_path: "../dataset/audio"
  OOD_data: "../training/OOD_texts.txt"
  min_length: 50                       # min phoneme sequence length (chars)
  num_workers: 16                      # CPU workers for data loading

# ── Preprocessing (must match Kokoro-82M exactly) ───────────────────────────
preprocess_params:
  sr: 24000
  spect_params:
    n_fft: 2048
    win_length: 1200
    hop_length: 300
    n_mels: 80
    fmin: 0
    fmax: 8000

# ── Model Architecture (must match Kokoro-82M exactly) ──────────────────────
model_params:
  dim_in: 64
  n_token: 178                        # Kokoro's IPA vocabulary (178 tokens)
  hidden_dim: 512
  style_dim: 128                      # ×2 = 256 in voicepack
  max_dur: 50
  multispeaker: false                 # single speaker fine-tuning (Kavi)
  n_mels: 80
  dropout: 0.2
  n_layer: 3
  text_encoder_kernel_size: 5

  decoder:
    type: istftnet                    # Kokoro uses ISTFTNet, NOT hifigan
    upsample_rates: [10, 6]
    upsample_kernel_sizes: [20, 12]
    upsample_initial_channel: 512
    resblock_kernel_sizes: [3, 7, 11]
    resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
    gen_istft_n_fft: 20
    gen_istft_hop_size: 5

  # Diffusion config (DISABLED — Kokoro doesn't use diffusion at inference)
  diffusion:
    embedding_mask_proba: 0.1
    transformer:
      num_layers: 3
      num_heads: 8
      head_features: 64
      multiplier: 2
    dist:
      sigma_data: 0.2
      estimate_sigma_data: true
      mean: -3.0
      std: 1.0

  # PLBERT config (English pre-trained; mostly frozen with low LR)
  plbert:
    hidden_size: 768
    num_attention_heads: 12
    intermediate_size: 2048
    max_position_embeddings: 512
    num_hidden_layers: 12
    dropout: 0.1

  # SLM discriminator (WavLM) — Stage 2 only
  slm:
    model: "microsoft/wavlm-base-plus"
    sr: 16000
    hidden: 768
    nlayers: 13
    initial_channel: 64

# ── Loss Weights ────────────────────────────────────────────────────────────
loss_params:
  lambda_gen: 1.0
  lambda_mel: 5.0                     # mel reconstruction (most important)
  lambda_dur: 1.0                     # duration prediction
  lambda_ce: 20.0                     # duration cross-entropy
  lambda_F0: 1.0                      # pitch prediction
  lambda_norm: 1.0                    # energy/norm prediction
  lambda_s2s: 1.0                    # sequence-to-sequence
  lambda_mono: 1.0                   # monotonic alignment
  lambda_slm: 1.0                    # SLM adversarial (0 = disabled for stage 1)
  lambda_diff: 0.0                   # DISABLED — Kokoro doesn't use diffusion
  lambda_sty: 0.0                    # DISABLED — style reconstruction
  TMA_epoch: 0                        # Start alignment from epoch 0 (fine-tuning)
  diff_epoch: 999                    # Effectively disable diffusion training
  joint_epoch: 3                     # Start SLM joint training at epoch 3

# ── Optimizer ────────────────────────────────────────────────────────────────
optimizer_params:
  lr: 0.0001                         # main learning rate
  bert_lr: 0.00001                   # low LR for PL-BERT (mostly frozen)
  ft_lr: 0.0001                      # fine-tuning LR for acoustic modules

# ── DEAD CONFIG (doesn't work — kept for reference only) ─────────────────────
# Neither train_first.py nor train_second.py reads from config["training"].
# All params above are read from the TOP LEVEL of the YAML.
training:
  epochs: 10
  batch_size: 8
  save_freq: 2
  log_interval: 10
  eval_interval: 500
  pretrained_model: "../training/kokoro_base.pth"
  load_only_params: true
  second_stage_load_pretrained: false

# ── Utility model paths ──────────────────────────────────────────────────────
F0_path: "Utils/JDC/bst.t7"
ASR_config: "Utils/ASR/config.yml"
ASR_path: "Utils/ASR/epoch_00080.pth"
PLBERT_dir: "Utils/PLBERT/"

slmadv_params:
  min_len: 100
  max_len: 500
  batch_percentage: 0.5
  iter: 10
  thresh: 5
  scale: 0.01
  sig: 1.5